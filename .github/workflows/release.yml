# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

# Publishes the package to GitHub Packages when a GitHub Release is published.
# Auth uses the repository-scoped GITHUB_TOKEN (no PAT required); the scoped
# @navikt registry and publishConfig.registry route the upload to GitHub Packages.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # upload the package to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - name: Configure auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # prepack runs build, oclif manifest, and SBOM generation before the tarball is created.
      - run: pnpm publish --no-git-checks # zizmor: ignore[use-trusted-publishing] GitHub Packages does not support npm trusted publishing.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
