# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

# Publishes the package to GitHub Packages when a GitHub Release is published.
# Auth uses the repository-scoped GITHUB_TOKEN (no PAT required); the scoped
# @navikt registry and publishConfig.registry route the upload to GitHub Packages.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # upload the package to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - name: Configure auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # prepack runs build, oclif manifest, and SBOM generation before the tarball is created.
      - run: pnpm publish --no-git-checks # zizmor: ignore[use-trusted-publishing] GitHub Packages does not support npm trusted publishing.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
