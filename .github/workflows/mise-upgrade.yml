name: Update mise Tools

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mise-tools-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  getToken:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
          token: ${{ steps.app-token.outputs.token }}
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: app-token
        with:
          client-id: ${{ vars.PLATFORM_TOKEN_APP_ID }}
          private-key: ${{ secrets.PLATFORM_TOKEN_APP_PRIVATE_KEY }}
  update-mise-tools:
    needs: getToken
    uses: navikt/crm-workflows-base/.github/workflows/mise-tools-update.yml@9f0a692a3e63db3c892a38ed79222a0b61b02bde
    permissions:
      contents: write
      pull-requests: write
    secrets:
      token: ${{ needs.getToken.outputs.token }}