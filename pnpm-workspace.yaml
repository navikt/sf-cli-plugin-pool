minimumReleaseAgeExclude:
  - '@salesforce/plugin-info@3.4.143'
overrides:

  # Override transitive minimatch to a patched release.
  # Mitigates GHSA-7r86-cg39-jmmj (Inefficient Algorithmic Complexity); fixed in minimatch 9.0.7.
  minimatch: '>=9.0.7'

  # Override transitive js-yaml to a patched release.
  # Mitigates GHSA-5p4m-2wfm-xmqj (Inefficient Algorithmic Complexity); fixed in js-yaml 4.2.0.
  js-yaml: '>=4.3.1'

  # Override transitive @babel/core to avoid the 7.28.6 bug; fixed in 7.29.6.
  '@babel/core': '>=7.29.6'

  # Override transitive serialize-javascript to a patched release.
  # Mitigates GHSA-qj8w-gfj5-8c6v (CPU exhaustion DoS); fixed in serialize-javascript 7.0.5.
  serialize-javascript: '>=7.0.5'