allowBuilds:
  unrs-resolver@1.12.2: true

minimumReleaseAgeExclude:
  - eslint-plugin-sf-plugin@3.0.0

overrides:

  # Override transitive csv-parse to a patched release.
  # Mitigates CVE-2026-85063; fixed in csv-parse 7.0.2.
  csv-parse: '>=7.0.2'

  # Override transitive fast-uri to a patched release.
  # Mitigates GHSA-jqff-g426-hqxp; fixed in fast-uri 3.1.6.
  fast-uri: '>=3.1.6'

  # Override transitive linkify-it to a patched release.
  # Mitigates GHSA-v245-v573-v5vm (Inefficient Algorithmic Complexity); fixed in linkify-it 5.0.2.
  linkify-it: '>=5.0.2'

  # Override transitive uuid to a patched release.
  # Mitigates GHSA-w5hq-g745-h8pq; fixed in uuid 11.1.1.
  uuid: '>=11.1.1'

  # Override transitive markdown-it to a patched release.
  # Mitigates GHSA-gfr2-rv44-r23c
  markdown-it: '>=15.0.3'

  # Override transitive undici to a patched release.
  # Mitigates GHSA-jr45-8vmc-qm54; fixed in undici 7.29.0.
  undici: '>=7.29.0'

  # Override transitive minimatch to a patched release.
  # Mitigates GHSA-7r86-cg39-jmmj (Inefficient Algorithmic Complexity); fixed in minimatch 9.0.7.
  minimatch: '>=9.0.7'

  # Override transitive js-yaml to a patched release.
  # Mitigates GHSA-5p4m-2wfm-xmqj (Inefficient Algorithmic Complexity); fixed in js-yaml 4.2.0.
  js-yaml: '>=4.3.1'

  # Override transitive @babel/core to avoid the 7.28.6 bug; fixed in 7.29.6.
  '@babel/core': '>=7.29.6'

  # Override transitive serialize-javascript to a patched release.
  # Mitigates GHSA-m5mm-p8h7-m29v ( Cross-site scripting ); fixed in serialize-javascript 7.1.3.
  serialize-javascript: '>=7.1.3'

  # Override transitive brace-expansion to a patched release.
  # Mitigates GHSA-q2hr-2g5m-vwhr; fixed in brace-expansion 5.0.12.
  brace-expansion: '>=5.0.12'

  # Override transitive source-map-js to a patched release.
  # Mitigates CVE-2026-93749; fixed in source-map-js 1.2.3.
  source-map-js: '>=1.2.2'