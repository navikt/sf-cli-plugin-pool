allowBuilds:
  unrs-resolver@1.12.2: true

overrides:
  # Override transitive uuid to a patched release.
  # Mitigates GHSA-w5hq-g745-h8pq; fixed in uuid 11.1.1.
  uuid: '>=11.1.1'

  # Override transitive serialize-javascript to a patched release.
  # Mitigates GHSA-m5mm-p8h7-m29v ( Cross-site scripting ); fixed in serialize-javascript 7.1.3.
  serialize-javascript: '>=7.1.3'